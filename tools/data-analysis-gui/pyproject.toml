[project]
name = "bci-data-analysis-gui"
version = "0.1.0"
description = "Single-day and cross-day neural/behavior data analysis workbench for 512-channel spike-count XDF recordings."
requires-python = ">=3.11.15,<3.12"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<1.18",
  "matplotlib>=3.10,<3.12",
  "pyxdf==1.17.5",
  "umap-learn>=0.5.7,<0.6",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
python-preference = "only-managed"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
