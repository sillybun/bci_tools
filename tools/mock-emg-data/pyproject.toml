[project]
name = "bci-mock-emg-data"
version = "0.1.0"
description = "Mouse-controlled synthetic EMG packets published over LSL."
requires-python = ">=3.11.15,<3.12"
dependencies = [
    "numpy>=1.24,<3",
    "pyside6-essentials>=6.8,<7",
    "pylsl>=1.18.2,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
python-preference = "only-managed"
