[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-pdf"
version = "0.1.0"
description = "Export Notion pages to PDF and HTML with a desktop preview"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["requests>=2.31.0", "jinja2>=3.1.2", "playwright>=1.40.0", "Pillow>=10.0.0", "python-dateutil>=2.8.2", "PySide6>=6.6.0", "rembg[cpu]>=2.0.83"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
notion-pdf = "notion_pdf.cli:main"
notion-pdf-gui = "notion_pdf.gui:main"

[tool.setuptools.packages.find]
include = ["notion_pdf*"]

[tool.setuptools.package-data]
notion_pdf = ["assets/*.svg"]
